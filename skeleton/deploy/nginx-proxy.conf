# gunicorn 으로 넘기는 공통 설정(deploy/nginx.conf 의 각 location 이 include 한다).
# 설치(root 소유 사본): sudo install -o root -g root -m 0644 deploy/nginx-proxy.conf /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf
# ⛔ 코드 폴더의 이 파일을 바로 include 하지 않는다 — 코드 폴더는 배포 계정이 쓸 수 있어 root 로 읽히는 nginx 설정이 될 수 없다.
# 이 파일을 고치면 위 명령으로 다시 설치하고 sudo nginx -t 가 통과할 때만 reload 한다.
# 앱은 .env 의 TRUSTED_PROXY_HOPS=1 로 아래 X-Forwarded-* 를 믿는다(app/web/proxy.py) — 이 헤더가 없으면
# HTTPS 를 인식하지 못해 CSRF 의 HTTPS Referer 검사가 동작하지 않는다.
proxy_pass http://__PROJECT_SNAKE___app;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
