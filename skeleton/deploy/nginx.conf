# nginx 사이트 — 도메인 → gunicorn 유닉스 소켓(/run/__PROJECT_SNAKE__/gunicorn.sock, deploy/app.service).
# server_name 의 app.example.com 을 실제 도메인으로 바꾼다. nginx 1.19.4 이상이 필요하다(ssl_reject_handshake).
# 설치(모두 root 소유 사본 — 코드 폴더의 파일을 include·심볼릭 링크하지 않는다):
#       sudo install -o root -g root -m 0644 deploy/nginx-proxy.conf /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf
#       sudo install -o root -g root -m 0644 deploy/nginx.conf /etc/nginx/sites-available/__PROJECT_SNAKE__
#       sudo ln -s /etc/nginx/sites-available/__PROJECT_SNAKE__ /etc/nginx/sites-enabled/__PROJECT_SNAKE__
#       sudo rm /etc/nginx/sites-enabled/default   # 배포판 기본 사이트도 default_server 라 아래 블록과 겹친다
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d app.example.com   # 앱 server 블록에 443 과 80→443 이동을 추가한다
# 한 서버에 여러 사이트를 두면 아래 기본 서버(default_server) 블록은 그중 한 파일에만 둔다.
# 같은 서버의 다른 사이트와 이름이 겹치지 않게 upstream·요청 제한 zone 이름에 프로젝트 이름을 붙인다.
# 요청 제한·타임아웃·본문 상한 값은 출발점일 뿐이다 — 서비스 트래픽에 맞게 정하고, 운영 값은 공개 저장소에 그대로 두지 않는다.

limit_req_zone $binary_remote_addr zone=__PROJECT_SNAKE___page:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=__PROJECT_SNAKE___login:10m rate=10r/m;

upstream __PROJECT_SNAKE___app {
    server unix:/run/__PROJECT_SNAKE__/gunicorn.sock fail_timeout=0;
}

# 알 수 없는 Host(IP 직접 접속·다른 도메인)는 앱에 닿지 않게 끊는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    server_tokens off;

    # 요청 본문 상한 — 기본은 작게 두고 실제 업로드 경로에서만 넓힌다(아래 location).
    # 넓은 상한을 서버 전체에 두면 익명 요청도 큰 본문을 보내 CSRF·인증 검사 전에 디스크에 쌓을 수 있다.
    # 업로드 location 의 값은 .env 의 MAX_*_UPLOAD_MB + 여유다. 앱도 본문 상한(app/main.py·app/web/body_limit.py)과
    # 파일별 상한(app/web/files.py)을 다시 검사한다. 업로드 상한이나 업로드 경로를 바꾸면 함께 고친다.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # 화면 요청 제한(IP 단위). limit_req 를 따로 둔 location(/login)은 이 값을 물려받지 않는다.
    limit_req zone=__PROJECT_SNAKE___page burst=60 nodelay;
    limit_req_status 429;

    # 로그인은 IP 단위로 더 좁게 제한한다 — 앱의 잠금은 계정 단위다(ARCHITECTURE.md §21).
    location = /login {
        limit_req zone=__PROJECT_SNAKE___login burst=5 nodelay;
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }

    # DB 헬스 체크는 내부 전용이다(리비전·DB 상태 노출). deploy.sh 는 소켓으로 직접 확인한다.
    # 외부 상태 확인에는 /api/v1/health 를 쓴다.
    location = /api/v1/health/db {
        return 404;
    }

    # 공지 첨부(MAX_ATTACHMENT_UPLOAD_MB 20 + 여유).
    location ~ ^/admin/notices/[0-9]+/attachments$ {
        client_max_body_size 23m;
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }

    # 이미지 업로드 — 편집기 이미지·배너 생성·수정(MAX_IMAGE_UPLOAD_MB 5 + 여유).
    location = /admin/editor/images {
        client_max_body_size 8m;
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }

    location ~ ^/admin/banners/(new|[0-9]+)$ {
        client_max_body_size 8m;
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }

    # 공지 작성·수정 폼 — urlencoded 라 본문(최대 20만 자)의 한글 한 글자가 9 bytes(%XX×3)로 늘어난다.
    location ~ ^/admin/notices/(new|[0-9]+)$ {
        client_max_body_size 3m;
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/__PROJECT_SNAKE__-proxy.conf;
    }
}
