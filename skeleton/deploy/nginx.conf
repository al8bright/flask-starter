# nginx 사이트 — 도메인 → gunicorn(127.0.0.1:8000). server_name 의 app.example.com 을 실제 도메인으로 바꾼다.
# 설치: sudo cp deploy/nginx.conf /etc/nginx/sites-available/__PROJECT_SNAKE__
#       sudo ln -s /etc/nginx/sites-available/__PROJECT_SNAKE__ /etc/nginx/sites-enabled/__PROJECT_SNAKE__
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d app.example.com   # 443 server 블록과 80→443 이동을 이 파일에 추가한다
# 같은 서버의 다른 사이트와 이름이 겹치지 않게 요청 제한 zone 이름에 프로젝트 이름을 붙인다.
# 요청 제한·타임아웃 값은 출발점일 뿐이다 — 서비스 트래픽에 맞게 정하고, 운영 값은 공개 저장소에 그대로 두지 않는다.

limit_req_zone $binary_remote_addr zone=__PROJECT_SNAKE___page:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=__PROJECT_SNAKE___login:10m rate=10r/m;

server {
    listen 80;
    server_name app.example.com;

    # 앱의 요청 본문 상한(가장 큰 업로드 상한 + 2 MB — 기본 22 MB, app/main.py)보다 조금 크게 둔다.
    # MAX_*_UPLOAD_MB 를 바꾸면 함께 고친다. 넘치는 요청은 앱이 413 으로 다시 거부한다.
    client_max_body_size 23m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # 로그인은 IP 단위로 더 좁게 제한한다 — 앱의 잠금은 계정 단위다(ARCHITECTURE.md §21).
    location = /login {
        limit_req zone=__PROJECT_SNAKE___login burst=5 nodelay;
        limit_req_status 429;
        include /srv/__PROJECT_SNAKE__/deploy/nginx-proxy.conf;
    }

    location / {
        limit_req zone=__PROJECT_SNAKE___page burst=60 nodelay;
        limit_req_status 429;
        include /srv/__PROJECT_SNAKE__/deploy/nginx-proxy.conf;
    }
}
