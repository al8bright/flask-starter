{% extends "admin/_layout.html" %}
{% block admin %}
<h1 class="text-2xl font-semibold">사용자</h1>
<form method="get" class="mt-6 flex flex-wrap gap-2" role="search">
  <input type="search" name="q" value="{{ q }}" maxlength="100" placeholder="아이디 검색" aria-label="아이디 검색" class="input max-w-xs">
  <select name="role" class="input w-auto" aria-label="권한">
    <option value="">전체 권한</option>
    <option value="user" {{ 'selected' if role == 'user' }}>user</option>
    <option value="admin" {{ 'selected' if role == 'admin' }}>admin</option>
  </select>
  <button class="btn">검색</button>
</form>
<p class="mt-4 text-sm text-muted">{{ result.total }}명</p>
<table class="table mt-2">
  <thead><tr><th>아이디</th><th>권한·활성</th><th>세션</th><th>가입</th><th></th></tr></thead>
  <tbody>
    {% for user in result.items %}{% include "partials/admin_user_row.html" %}{% endfor %}
  </tbody>
</table>
{% include "partials/pagination.html" %}
{% endblock %}
