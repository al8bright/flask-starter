{#- 사용자 행 — htmx 예제 2: 저장하면 이 행만 다시 그린다(app/web/admin/users.py). 오류는 #alerts 로 간다. -#}
<tr id="user-{{ user.id }}">
  <td class="font-semibold">{{ user.username }}</td>
  <td>
    <form method="post" action="{{ url_for('admin.update_user', user_id=user.id) }}" class="flex flex-wrap items-center gap-3"
          hx-post="{{ url_for('admin.update_user', user_id=user.id) }}" hx-target="#user-{{ user.id }}" hx-swap="outerHTML">
      {{ csrf_field() }}
      <select name="role" class="input w-auto py-1" aria-label="{{ user.username }} 권한">
        <option value="user" {{ 'selected' if user.role == 'user' }}>user</option>
        <option value="admin" {{ 'selected' if user.role == 'admin' }}>admin</option>
      </select>
      <label class="flex items-center gap-1.5"><input type="checkbox" name="is_active" {{ 'checked' if user.is_active }}> 활성</label>
      <button class="btn px-3 py-1">저장</button>
      {% if saved %}<span class="text-xs font-semibold text-accent" role="status">저장됨</span>{% endif %}
    </form>
  </td>
  <td class="text-center tabular-nums">{{ user.active_session_count }}</td>
  <td class="tabular-nums text-muted">{{ user.created_at.strftime('%Y.%m.%d') }}</td>
  <td class="text-right">
    {% if user.active_session_count %}
    <form method="post" action="{{ url_for('admin.revoke_user_sessions', user_id=user.id) }}" data-confirm="{{ user.username }} 의 모든 세션을 폐기할까요?">
      {{ csrf_field() }}<button class="link-danger whitespace-nowrap">세션 폐기</button>
    </form>
    {% endif %}
  </td>
</tr>
