name: CI

# ARCHITECTURE.md §20: 이 CI 는 push 이후 도는 사후 안전망이다.
# 게이트는 push 전 로컬 검증(ruff·pytest)이다. CI 가 실패하면 되돌리거나 즉시 고친다.
#
# 공급망 고정: 액션은 전체 커밋 SHA(주석은 태그), 서비스 이미지는 digest(주석은 태그)로 고정하고,
# 패키지는 전이 의존성까지 해시로 고정한 requirements.lock 만 설치한다(--require-hashes).
# 체크아웃은 persist-credentials: false 로 GITHUB_TOKEN 을 작업 트리 git 설정에 남기지 않는다.
# 액션·pip 갱신은 Dependabot(.github/dependabot.yml)이 PR 로 올린다(stack-versions 스킬 §5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 매주 월요일 09:00 KST — 코드 변경 없이 공개되는 CVE 를 잡도록 audit·lock 잡만 돈다(나머지 잡은 건너뛴다).
  # ⚠️ 공개 저장소는 60일 동안 활동이 없으면 GitHub 이 schedule 을 끈다(Actions 탭에서 다시 켠다).
  schedule:
    - cron: '0 0 * * 1'

# 최소 권한 — 미선언이면 리포/조직 설정에 따라 GITHUB_TOKEN 이 read-write 로 발급된다.
# 이 워크플로는 체크아웃과 검증만 하므로 읽기면 충분하다.
permissions:
  contents: read

# 같은 PR 에 연속 push 하면 이전 실행을 취소해 러너 시간을 아낀다(main push 는 취소하지 않는다).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    # 이 프로젝트는 Windows 와 macOS/Linux 에서 함께 개발한다.
    # Ubuntu 만 돌리면 OS 분기 버그(경로·인코딩·시각대·휠)를 잡지 못한다.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          pip check
      - name: Ruff (lint)
        run: ruff check .
      - name: Pytest
        # 테스트는 SQLite 를 쓴다 — 외부 DB 불필요 (§12). DeprecationWarning 은 실패로 본다.
        run: pytest -q -W error::DeprecationWarning

  css:
    # Tailwind standalone CLI 내려받기 → SHA-256 검증 → 빌드 (§15).
    # 두 OS 에서 각자의 스크립트(tailwind.sh · tailwind.ps1)를 실제로 돌린다.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build CSS (tailwind.sh)
        if: runner.os != 'Windows'
        run: bash scripts/tailwind.sh
      - name: Build CSS (tailwind.ps1, Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\tailwind.ps1
      - name: app.css 생성 확인
        shell: bash
        run: test -s app/static/css/app.css

  migrations:
    # ⚠️ 서비스 컨테이너(postgres:16)는 Linux 러너에서만 동작한다 — DB 검증은 별도 ubuntu 잡이다.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    services:
      postgres:
        # postgres:16 (16.16, 2026-11-24 빌드) — 태그는 같은 이름으로 새 이미지를 가리킬 수 있어 digest 로 고정한다.
        image: postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_migration_check
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Alembic (마이그레이션 왕복 검증)
        # 실제 PostgreSQL 에 마이그레이션을 적용하고 모델과의 불일치를 검사한다 (§11).
        # downgrade base → upgrade head 왕복으로 downgrade 경로도 검증한다 — 깨진 downgrade 는 운영 롤백 때 처음 드러난다.
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ci_migration_check
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  # .ps1 은 Windows PowerShell 5.1 에서 파싱되어야 한다.
  # PS7 전용 문법(??, ?:, &&/||)이 하나라도 섞이면 5.1 은 한 줄도 실행하지 못한다.
  powershell-syntax:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check .ps1 syntax with Windows PowerShell 5.1
        shell: powershell # pwsh 가 아니라 5.1 이어야 의미가 있다
        # ⛔ 검사 로직을 여기 인라인으로 옮기지 않는다. Actions 는 이 스텝을 BOM 없는 UTF-8
        #    임시 파일로 쓰는데 5.1 은 그것을 ANSI 로 읽어 한글이 깨지고 따옴표 짝이 무너진다
        #    ("The string is missing the terminator"). 스크립트 파일은 BOM 을 달아 커밋한다.
        run: .\.github\scripts\check-ps1-syntax.ps1

  # ── lock 정합 (requirements.txt → requirements.lock) ─────────────────────
  # 사람이 고치는 requirements.txt(·.github/requirements-ci.txt)와 해시 lock 이 어긋나면 실패한다.
  # 핀한 uv 로 같은 기준 시각(scripts/versions.env 의 LOCK_EXCLUDE_NEWER)에서 다시 만들어 비교한다.
  # ⚠️ Dependabot 의 pip PR 은 requirements.txt 만 바꾸므로 이 잡이 실패한다 — 같은 PR 에서
  #    `python scripts/lock.py` 로 lock 을 다시 만들어 올린다(stack-versions 스킬 §5-1).
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: CI 도구 설치 (requirements-ci.lock — uv·pip-audit 를 해시로 고정)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: lock 재생성 비교
        run: python -B scripts/lock.py --check

  # ── 의존성 취약점 스캔 (경고성) ──────────────────────────────────────────
  # ⚠️ 트레이드오프: 스캔 스텝은 continue-on-error 다. 새 CVE 는 코드 변경 없이도 공개되므로
  #    실패로 두면 아무 커밋 없이 CI 가 빨간불이 된다 — 그래서 경고로만 남긴다.
  #    대신 실제 취약점이 나와도 워크플로는 초록이므로, 이 잡의 로그(주황 ⚠ 표시)를 주기적으로
  #    확인하고 패치한다(매주 schedule 실행 포함). 강제 차단으로 바꾸려면 continue-on-error 를 제거한다.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version
      - name: CI 도구 설치 (requirements-ci.lock — pip-audit 를 해시로 고정)
        run: python -m pip install --require-hashes -r .github/requirements-ci.lock
      - name: pip-audit (requirements.lock 취약점 스캔 — 전이 의존성 포함)
        # --disable-pip: lock 이 이미 전체 고정이라 격리 venv 에 다시 설치하지 않고 적힌 버전을 그대로 조회한다.
        # 환경 마커는 이 러너(Linux) 기준으로 평가한다 — Windows 전용 패키지(colorama 등)는 조회에서 빠진다.
        continue-on-error: true
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
